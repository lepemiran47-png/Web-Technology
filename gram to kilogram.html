
<!DOCTYPE html>
<html>
<head>
    <title>Gram to Kilogram Converter</title>
</head>
<body>

    <form>
        <div>
            <label>Enter mass in grams:</label>
            <input type="number" id="grams" 
            oninput="convert()">
        </div>

        <div>
            <input type="button" value="Convert"
            onclick="convert()">
        </div>

        <div id="result"></div>
    </form>

    <script>
        function convert() {
            let grams = document.getElementById("grams").value;
            let kg = grams / 1000;

            document.getElementById("result").textContent =
            kg + " Kilograms";
        }
    </script>

</body>
</html>
